const sb = async (path, options = {}) => {
  const method = options.method || "GET";
  const url = `${SUPABASE_URL}/rest/v1/${path}`;
  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${SUPABASE_KEY}`,
    "Content-Type": "application/json",
    "Accept": "application/json",
  };
  if (method === "POST") headers["Prefer"] = "return=representation";
  try {
    const res = await fetch(url, { method, headers, mode: "cors", body: options.body || undefined });
    const text = await res.text();
    if (!res.ok) throw new Error(text);
    return text ? JSON.parse(text) : [];
  } catch(e) {
    console.error("API Error:", e.message);
    throw e;
  }
};

const calcStats = (records) => {
  const result = {};
  records.forEach((r) => {
    if (!result[r.staff]) result[r.staff] = {
      nailTotal:0, hanpaiTotal:0, total:0, count:0, repeat:0, shimei:0,
      visitCounts:{"初回":0,"2回目":0,"3回目":0,"4回目以上":0},
      menuCounts:{"ハンド":0,"フット":0,"当店offのみ":0,"他店offのみ":0},
      payment:{"現金":0,"クレジット":0,"QRコード決済":0,"スマート支払い":0},
      hanpai:{"KOYO物販":0,"ガモウ物販":0,"ネイル物販":0,"プロテイン":0}
    };
    const d = result[r.staff];
    d.nailTotal += r.nailPrice; d.hanpaiTotal += r.hanpaiTotal;
    d.total += r.nailPrice + r.hanpaiTotal; d.count += 1;
    if (r.isRepeat) d.repeat += 1;
    if (r.shimei) d.shimei += 1;
    if (r.payment) d.payment[r.payment] = (d.payment[r.payment] || 0) + 1;
    const vc = r.visitCount || "初回";
    if (d.visitCounts[vc] !== undefined) d.visitCounts[vc] += 1;
    const menus = r.nailMenus || [r.nailMenu];
    menus.forEach(m => { if (d.menuCounts[m] !== undefined) d.menuCounts[m] += 1; });
    HANPAI_MENUS.forEach(m => { d.hanpai[m] += r.hanpai[m] || 0; });
  });
  return result;
};

const calcVisitCounts = (records) => {
  const result = {"初回":0,"2回目":0,"3回目":0,"4回目以上":0};
  records.forEach(r => { const vc = r.visitCount||"初回"; if (result[vc]!==undefined) result[vc]+=1; });
  return result;
};

const calcMenuCounts = (records) => {
  const result = {"ハンド":0,"フット":0,"当店offのみ":0,"他店offのみ":0};
  records.forEach(r => { const menus=r.nailMenus||[r.nailMenu]; menus.forEach(m=>{if(result[m]!==undefined)result[m]+=1;}); });
  return result;
};

const calcBookingSourceCounts = (records) => {
  const result = {};
  BOOKING_SOURCES.forEach(s => result[s] = 0);
  result["未回答"] = 0;
  records.forEach(r => { const bs = r.bookingSource || "未回答"; if (result[bs] !== undefined) result[bs] += 1; else result["未回答"] += 1; });
  return result;
};

const exportCSV = (selectedMonth, mr, byStaff, isOwner) => {
  const nailTotal=mr.reduce((s,r)=>s+r.nailPrice,0);
  const hanpaiTotal=mr.reduce((s,r)=>s+r.hanpaiTotal,0);
  const total=nailTotal+hanpaiTotal;
  const repeatRate=mr.length>0?Math.round((mr.filter(r=>r.isRepeat).length/mr.length)*100):0;
  const shimeiRate=mr.length>0?Math.round((mr.filter(r=>r.shimei).length/mr.length)*100):0;
  const avg=mr.length>0?Math.round(nailTotal/mr.length):0;
  const visitCounts=calcVisitCounts(mr); const menuCounts=calcMenuCounts(mr); const bsCounts=calcBookingSourceCounts(mr);
  let csv="\uFEFF";
  csv+=`月間売上レポート,${selectedMonth}\n\n`;
  csv+=`【売上サマリー】\n総売上,${total}\n施術売上,${nailTotal}\n店販売上,${hanpaiTotal}\n`;
  csv+=`客数,${mr.length}\n客単価,${avg}\n初回,${visitCounts["初回"]}\n`;
  csv+=`リピート率,${repeatRate}%\n指名率,${shimeiRate}%\n\n`;
  csv+=`【来店回数別】\n来店回数,件数,比率\n`;
  VISIT_COUNTS.forEach(v=>{const cnt=visitCounts[v]||0;const pct=mr.length>0?Math.round((cnt/mr.length)*100):0;csv+=`${v},${cnt},${pct}%\n`;});
  csv+=`\n【予約ルート別】\n予約ルート,件数,比率\n`;
  [...BOOKING_SOURCES,"未回答"].forEach(bs=>{const cnt=bsCounts[bs]||0;if(cnt===0)return;const pct=mr.length>0?Math.round((cnt/mr.length)*100):0;csv+=`${bs},${cnt},${pct}%\n`;});
  csv+=`\n【メニュー別】\nメニュー,件数,比率\n`;
  NAIL_MENUS.forEach(m=>{const cnt=menuCounts[m]||0;const pct=mr.length>0?Math.round((cnt/mr.length)*100):0;csv+=`${m},${cnt},${pct}%\n`;});
  csv+=`\n【決済方法別】\n決済方法,件数,比率\n`;
  PAYMENTS.forEach(p=>{const cnt=mr.filter(r=>r.payment===p).length;const pct=mr.length>0?Math.round((cnt/mr.length)*100):0;csv+=`${p},${cnt},${pct}%\n`;});
  csv+=`\n【物販カテゴリ別】\nカテゴリ,売上\n`;
  HANPAI_MENUS.forEach(m=>{const t=mr.reduce((s,r)=>s+(r.hanpai[m]||0),0);csv+=`${m},${t}\n`;});
  if (isOwner) {
    csv+=`\n【スタッフ別売上】\nスタッフ,売上,客数,客単価,リピート率\n`;
    STAFF_LIST.forEach(s=>{const d=byStaff[s.name];if(!d){csv+=`${s.name},0,0,0,0%\n`;return;}const sAvg=d.count>0?Math.round(d.nailTotal/d.count):0;const sRepeat=d.count>0?Math.round((d.repeat/d.count)*100):0;csv+=`${s.name},${d.total},${d.count},${sAvg},${sRepeat}%\n`;});
  }
  csv+=`\n【明細】\n日付,スタッフ,メニュー,施術売上,店販売上,来店回数,指名,決済方法,予約ルート\n`;
  mr.forEach(r=>{const menus=(r.nailMenus||[r.nailMenu]).join("・");csv+=`${r.date},${r.staff},${menus},${r.nailPrice},${r.hanpaiTotal},${r.visitCount||"初回"},${r.shimei?"指名あり":"指名なし"},${r.payment},${r.bookingSource||"未回答"}\n`;});
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`売上レポート_${selectedMonth}.csv`;a.click();
  URL.revokeObjectURL(url);
};

function LoginScreen({onLogin}){
  const [selectedId,setSelectedId]=useState("");
  const [password,setPassword]=useState("");
  const [error,setError]=useState("");
  const handleLogin=()=>{
    const user=STAFF_LIST.find(s=>s.id===selectedId);
    if(!user){setError("スタッフを選択してください");return;}
    if(user.password!==password){setError("パスワードが違います");return;}
    onLogin(user);
  };
  return(
    <div style={{fontFamily:"sans-serif",background:"#fdf8f4",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{background:"white",borderRadius:20,padding:28,width:"100%",maxWidth:360,boxShadow:"0 4px 24px rgba(0,0,0,0.08)"}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{fontSize:11,letterSpacing:3,color:"#a07850",marginBottom:6}}>燈乃工房・本店</div>
          <div style={{fontSize:22,fontWeight:700,color:"#2d2016"}}>売上管理</div>
        </div>
        <FR label="スタッフを選択">
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {STAFF_LIST.map(s=>(
              <button key={s.id} onClick={()=>{setSelectedId(s.id);setPassword("");setError("");}}
                style={{...cS,padding:"12px 16px",background:selectedId===s.id?"#a07850":"#f0e8de",color:selectedId===s.id?"white":"#a07850",textAlign:"left",borderRadius:12}}>
                {s.name} {s.role==="owner"&&"👑"}
              </button>
            ))}
          </div>
        </FR>
        <FR label="パスワード">
          <input type="password" inputMode="numeric" pattern="[0-9]*" placeholder="パスワードを入力" value={password}
            onChange={e=>{setPassword(e.target.value);setError("");}}
            onKeyDown={e=>e.key==="Enter"&&handleLogin()} style={iS}/>
        </FR>
        {error&&<div style={{color:"#e05050",fontSize:13,marginBottom:12,textAlign:"center"}}>{error}</div>}

function StaffAnnualView({records, currentUser}){

  const myRecords = records.filter(r=>r.staff===currentUser.name);
  const years = ["2024","2025","2026"];

  const monthlyData = useMemo(()=>{
    const result = {};
    for(let m=1;m<=12;m++){
      const key=`${selectedYear}-${String(m).padStart(2,"0")}`;
      const mr=myRecords.filter(r=>r.date.startsWith(key));
      const nailTotal=mr.reduce((s,r)=>s+r.nailPrice,0);
      const hanpaiTotal=mr.reduce((s,r)=>s+r.hanpaiTotal,0);
      const total=nailTotal+hanpaiTotal;
      const count=mr.length;
      const repeat=mr.filter(r=>r.isRepeat).length;
      const shimei=mr.filter(r=>r.shimei).length;
      result[m]={total,nailTotal,hanpaiTotal,count,repeat,shimei,mr};
    }
    return result;
  },[myRecords,selectedYear]);

  const yearTotal=Object.values(monthlyData).reduce((s,d)=>s+d.total,0);
  const yearCount=Object.values(monthlyData).reduce((s,d)=>s+d.count,0);

                    {m}月{isNow?" 🟤":""}
                  </div>
                  <div style={{fontSize:18,fontWeight:700,color:"#a07850"}}>¥{d.total.toLocaleString()}</div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
                  {[
                    {label:"客数",value:d.count+"名"},
                    {label:"客単価",value:"¥"+avg.toLocaleString()},
                    {label:"リピート率",value:rr+"%"},
                    {label:"初回",value:(d.count-d.repeat)+"名"},
                    {label:"指名率",value:sr+"%"},
                    {label:"店販",value:"¥"+d.hanpaiTotal.toLocaleString()},
                  ].map(({label,value})=>(
                    <div key={label} style={{background:"#fdf8f4",borderRadius:8,padding:"6px",textAlign:"center"}}>
                      <div style={{fontSize:10,color:"#999",marginBottom:2}}>{label}</div>
                      <div style={{fontSize:12,fontWeight:700,color:"#a07850"}}>{value}</div>
                    </div>
                  ))}
                </div>
                <div style={{fontSize:11,color:"#a07850",marginTop:8,fontWeight:600}}>{isExp?"▲ 閉じる":"▼ 詳細を見る"}</div>
              </div>
              {isExp&&(
                <div style={{padding:"0 14px 14px",background:"white"}}>
                  <div style={{background:"#fdf8f4",borderRadius:10,padding:"12px",marginBottom:8}}>
                    <div style={{fontSize:12,fontWeight:700,color:"#888",marginBottom:8}}>🔁 来店回数内訳</div>
                    {VISIT_COUNTS.map(v=>{
                      const cnt=visitCounts[v]||0;
                      const pct=d.count>0?Math.round(cnt/d.count*100):0;
                      return(<div key={v} style={{marginBottom:8}}>
                        <div style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
                          <span style={{color:"#888"}}>{v}</span>
                          <span style={{fontWeight:700,color:"#a07850"}}>{pct}%（{cnt}名）</span>
                        </div>
                        <Bar pct={pct} color="#a07850"/>
                      </div>);
                    })}
                  </div>
                  <div style={{background:"#fdf8f4",borderRadius:10,padding:"12px"}}>
                    <div style={{fontSize:12,fontWeight:700,color:"#888",marginBottom:8}}>記録一覧</div>
                    {d.mr.sort((a,b)=>b.date.localeCompare(a.date)).map(r=>(
                      <div key={r.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,paddingBottom:8,borderBottom:"1px solid #ede8e0"}}>
                        <div>
                          <div style={{fontSize:13,fontWeight:600}}>{(r.nailMenus||[r.nailMenu]).join("・")}</div>
                          <div style={{fontSize:11,color:"#999"}}>{r.date} · {r.visitCount||"初回"} · {r.shimei?"👆 指名":"指名なし"}</div>
                        </div>
                        <span style={{fontSize:13,fontWeight:700,color:"#a07850"}}>¥{(r.nailPrice+r.hanpaiTotal).toLocaleString()}</span>
                      </div>
                    ))}
                    {d.mr.length===0&&<div style={{textAlign:"center",color:"#ccc",fontSize:13}}>記録なし</div>}
                  </div>
                </div>
              )}
            </div>
          );
        }).filter(Boolean)}
        {yearTotal===0&&<EmptyState/>}
      </div>
    </div>
  );
}

function SalonApp(){
  const [currentUser,setCurrentUser]=useState(null);
  const [records,setRecords]=useState([]);
  const [loading,setLoading]=useState(false);
  const [form,setForm]=useState(initialForm);
  const [view,setView]=useState("input");
  const [selectedMonth,setSelectedMonth]=useState(()=>new Date().toISOString().slice(0,7));
  const [selectedYear,setSelectedYear]=useState(()=>String(new Date().getFullYear()));
  const [toast,setToast]=useState("");
  const [expandedStaff,setExpandedStaff]=useState(null);
  const [deleteTarget,setDeleteTarget]=useState(null);
  const [customers,setCustomers]=useState([]);
  const [selectedCustomer,setSelectedCustomer]=useState(null);
  const [customerSearch,setCustomerSearch]=useState("");
  const [showNewCustomerForm,setShowNewCustomerForm]=useState(false);
  const [newCustomerName,setNewCustomerName]=useState("");
  const [newCustomerPhone,setNewCustomerPhone]=useState("");
  const [registerDate,setRegisterDate]=useState(TODAY);
  const [registerActual,setRegisterActual]=useState({cash:"",credit:"",qr:"",smart:""});
  const [registerReasons,setRegisterReasons]=useState({});
  const [registerExistingId,setRegisterExistingId]=useState(null);
  const [registerSaving,setRegisterSaving]=useState(false);
  const [registerSaved,setRegisterSaved]=useState(false);
  const [registerLoading,setRegisterLoading]=useState(false);
  const [closings,setClosings]=useState([]);
  const [closingsMonth,setClosingsMonth]=useState(()=>new Date().toISOString().slice(0,7));
  const [selectedClosing,setSelectedClosing]=useState(null);
  const [existingCloseDates,setExistingCloseDates]=useState([]);

  const isOwner=currentUser?.role==="owner";
  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(""),2500);};

  const loadRecords=async()=>{
    setLoading(true);
    try{const data=await sb("records?order=date.desc",{method:"GET"});setRecords(data.map(toRecord));}
    catch(e){showToast("データ読み込みエラー");}
    finally{setLoading(false);}
  };

  useEffect(()=>{if(currentUser)loadRecords();},[currentUser]);
  useEffect(()=>{
    if(!currentUser)return;
    sb("customers?order=name.asc",{method:"GET"}).then(res=>setCustomers(res||[])).catch(()=>{});
  },[currentUser]);
  useEffect(()=>{
    if(!currentUser)return;
    sb("register_closings?select=close_date",{method:"GET"}).then(res=>{
      setExistingCloseDates((res||[]).map(r=>r.close_date));
    }).catch(()=>{});
  },[currentUser]);
  useEffect(()=>{if(currentUser&&view==="register")loadRegisterForDate(registerDate);},[view,registerDate,currentUser]);
  useEffect(()=>{if(currentUser&&view==="register_history")loadClosings(closingsMonth);},[view,closingsMonth,currentUser]);

  const getVisitLabel=(customerId)=>{
    if(!customerId)return null;
    const count=records.filter(r=>r.customerId===customerId).length+1;
    if(count===1)return"初回";
    if(count===2)return"2回目";
    if(count===3)return"3回目";
    return"4回目以上";
  };

  const searchedCustomers=customerSearch
    ?customers.filter(c=>{
      const digits=customerSearch.replace(/[^0-9]/g,"");
      return c.name.includes(customerSearch)||(digits.length>0&&(c.phone||"").includes(digits));
    })
    :[];

  const registerNewCustomerAndSelect=async()=>{
    if(!newCustomerName.trim()||!newCustomerPhone.trim()){showToast("お名前と電話番号を入力してください");return;}
    const phoneNormalized=newCustomerPhone.replace(/[^0-9]/g,"");
    try{
      const [created]=await sb("customers",{method:"POST",body:JSON.stringify({name:newCustomerName.trim(),phone:phoneNormalized})});
      setCustomers(prev=>[...prev,created]);
      setSelectedCustomer(created);
      setShowNewCustomerForm(false);
      setNewCustomerName("");setNewCustomerPhone("");setCustomerSearch("");
      showToast("新しいお客様を登録しました");
    }catch(e){
      showToast("登録に失敗しました（同じ電話番号が既に登録されている可能性があります）");
    }
  };

  const handleDelete=(id)=>{setDeleteTarget(id);};
  const confirmDelete=async()=>{
    try{
      await sb(`records?id=eq.${deleteTarget}`,{method:"DELETE"});
      setRecords(prev=>prev.filter(p=>p.id!==deleteTarget));
      setDeleteTarget(null);showToast("削除しました");
    }catch(e){showToast("削除に失敗しました");}
  };

  const computeSystemTotals=(date)=>{
    const dayRecords=records.filter(r=>r.date===date);
    const totals={cash:0,credit:0,qr:0,smart:0};
    REGISTER_METHODS.forEach(m=>{
      totals[m.key]=dayRecords.filter(r=>r.payment===m.payment).reduce((s,r)=>s+r.nailPrice+r.hanpaiTotal,0);
    });
    return totals;
  };

  const loadRegisterForDate=async(date)=>{
    setRegisterLoading(true);
    setRegisterSaved(false);
    try{
      const res=await sb(`register_closings?close_date=eq.${date}`,{method:"GET"});
      if(res && res[0]){
        const c=res[0];
        setRegisterExistingId(c.id);
        setRegisterActual({
          cash:String(c.actual_cash??""),credit:String(c.actual_credit??""),
          qr:String(c.actual_qr??""),smart:String(c.actual_smart??"")
        });
        setRegisterReasons(c.diff_notes||{});
      }else{
        setRegisterExistingId(null);
        setRegisterActual({cash:"",credit:"",qr:"",smart:""});
        setRegisterReasons({});
      }
    }catch(e){/* ignore */}
    finally{setRegisterLoading(false);}
  };

  const saveRegisterClosing=async()=>{
    setRegisterSaving(true);
    try{
      const system=computeSystemTotals(registerDate);
      const diffNotes={};
      REGISTER_METHODS.forEach(m=>{
        const actual=Number(registerActual[m.key])||0;
        if(actual!==system[m.key]){
          diffNotes[m.key]=registerReasons[m.key]||{reason:"",memo:""};
        }
      });
      const body={
        close_date:registerDate,
        staff:currentUser.name,
        system_cash:system.cash,system_credit:system.credit,system_qr:system.qr,system_smart:system.smart,
        actual_cash:Number(registerActual.cash)||0,actual_credit:Number(registerActual.credit)||0,
        actual_qr:Number(registerActual.qr)||0,actual_smart:Number(registerActual.smart)||0,
        diff_notes:diffNotes,updated_at:new Date().toISOString()
      };
      if(registerExistingId){
        await sb(`register_closings?id=eq.${registerExistingId}`,{method:"PATCH",body:JSON.stringify(body)});
      }else{
        await sb("register_closings",{method:"POST",body:JSON.stringify(body)});
      }
      setRegisterSaved(true);
      setExistingCloseDates(prev=>prev.includes(registerDate)?prev:[...prev,registerDate]);
    }catch(e){showToast("保存に失敗しました");}
    finally{setRegisterSaving(false);}
  };

  const loadClosings=async(month)=>{
    try{
      const [y,m]=month.split("-");
      const lastDay=new Date(parseInt(y),parseInt(m),0).getDate();
      const res=await sb(`register_closings?close_date=gte.${month}-01&close_date=lte.${month}-${String(lastDay).padStart(2,"0")}&order=close_date.desc`,{method:"GET"});
      setClosings(res||[]);
    }catch(e){setClosings([]);}
  };

  const toggleMenu=(menu)=>{
    const current=form.nailMenus||[];
    if(current.includes(menu)){if(current.length===1)return;setForm({...form,nailMenus:current.filter(m=>m!==menu)});}
    else{setForm({...form,nailMenus:[...current,menu]});}
  };

  const handleSubmit=async()=>{
    if(!form.nailPrice){showToast("施術金額を入力してください");return;}
    const staffName=isOwner?form.staff:currentUser.name;
    if(!staffName){showToast("スタッフを選択してください");return;}
    const requireCustomer=form.date>=OPERATION_START;
    if(requireCustomer&&!selectedCustomer){showToast("お客様を選択してください");return;}
    const hanpaiParsed={};
    HANPAI_MENUS.forEach(m=>{hanpaiParsed[m]=Number(form.hanpai[m])||0;});
    const hanpaiTotal=Object.values(hanpaiParsed).reduce((a,b)=>a+b,0);
    const menusStr=(form.nailMenus||["ハンド"]).join("・");
    const visitLabel=selectedCustomer?getVisitLabel(selectedCustomer.id):form.visitCount;
    const payload={
      date:form.date,staff:staffName,customer_id:selectedCustomer?selectedCustomer.id:null,
      nail_menu:menusStr,nail_price:Number(form.nailPrice),
      is_repeat:isRepeatFromVisit(visitLabel),visit_count:visitLabel,shimei:form.shimei,
      payment:form.payment,booking_source:form.bookingSource||null,hanpai_koyo:hanpaiParsed["KOYO物販"],hanpai_gamo:hanpaiParsed["ガモウ物販"],
      hanpai_nail:hanpaiParsed["ネイル物販"],hanpai_protein:hanpaiParsed["プロテイン"],
      hanpai_total:hanpaiTotal,note:form.note,
    };
    try{
      const [saved]=await sb("records",{method:"POST",body:JSON.stringify(payload)});
      setRecords(prev=>[toRecord(saved),...prev]);
      setForm({...initialForm,date:form.date,staff:isOwner?form.staff:currentUser.name});
      setSelectedCustomer(null);setCustomerSearch("");
      showToast("登録しました！");
    }catch(e){showToast("登録に失敗しました");}
  };

  const canEdit=(r)=>{
    if(isOwner)return true;
    if(r.staff!==currentUser.name)return false;
    return r.date===TODAY;
  };

  const missingCloseDates=useMemo(()=>{
    const uniqueDates=[...new Set(records.map(r=>r.date))].filter(d=>d<TODAY);
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()-14);
    const cutoffStr=cutoff.toISOString().slice(0,10);
    return uniqueDates.filter(d=>d>=cutoffStr&&!existingCloseDates.includes(d)).sort().reverse();
  },[records,existingCloseDates]);

  const stats=useMemo(()=>{
    const visibleRecords=isOwner?records:records.filter(r=>r.staff===currentUser?.name);
    const byDay={},byMonth={},byYear={};
    records.forEach((r)=>{
      const total=r.nailPrice+r.hanpaiTotal;
      byDay[r.date]=(byDay[r.date]||0)+total;
      byMonth[r.date.slice(0,7)]=(byMonth[r.date.slice(0,7)]||0)+total;
      byYear[r.date.slice(0,4)]=(byYear[r.date.slice(0,4)]||0)+total;
    });
    const monthRecords=visibleRecords.filter(r=>r.date.startsWith(selectedMonth));
    const allMonthRecords=records.filter(r=>r.date.startsWith(selectedMonth));
    const yearRecords=visibleRecords.filter(r=>r.date.startsWith(selectedYear));
    return{byDay,byMonth,byYear,byStaff:calcStats(records),monthRecords,allMonthRecords,yearRecords,visibleRecords};
  },[records,selectedMonth,selectedYear,currentUser,isOwner]);

  if(!currentUser)return<LoginScreen onLogin={(user)=>{setCurrentUser(user);setForm({...initialForm,staff:user.role==="staff"?user.name:""});}}/>;

  const STAFF_NAMES=STAFF_LIST.map(s=>s.name);
  const tabs=isOwner
    ?[{key:"input",label:"入力"},{key:"register",label:"レジ締め"},{key:"daily",label:"日別"},{key:"monthly",label:"月別"},{key:"yearly",label:"年間"},{key:"staff",label:"スタッフ"},{key:"analysis",label:"📊分析"},{key:"register_history",label:"レジ締め履歴"}]
    :[{key:"input",label:"入力"},{key:"register",label:"レジ締め"},{key:"today",label:"📅今日"},{key:"monthly",label:"月別"},{key:"staff_annual",label:"年間"}];

  return(
    <div style={{fontFamily:"sans-serif",background:"#fdf8f4",minHeight:"100vh",color:"#2d2016",overflowX:"hidden",width:"100%",maxWidth:"100vw",boxSizing:"border-box"}}>
      <div style={{background:"linear-gradient(135deg,#c8a882,#a07850)",padding:"16px 16px 12px",color:"white",display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
        <div>
          <div style={{fontSize:11,letterSpacing:3,opacity:0.8,marginBottom:2}}>燈乃工房・本店</div>
          <div style={{fontSize:20,fontWeight:700}}>売上管理</div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:12,opacity:0.9}}>{currentUser.name} {isOwner?"👑":""}</div>
          <button onClick={()=>{setCurrentUser(null);setRecords([]);setView("input");}}
            style={{background:"rgba(255,255,255,0.2)",border:"none",color:"white",fontSize:11,padding:"4px 10px",borderRadius:8,cursor:"pointer",marginTop:4}}>
            ログアウト
          </button>
        </div>
      </div>

      <div style={{display:"flex",background:"white",borderBottom:"1px solid #e8ddd0",overflowX:"auto"}}>
        {tabs.map(tab=>(
          <button key={tab.key} onClick={()=>setView(tab.key)}
            style={{flex:1,minWidth:60,padding:"12px 8px",border:"none",background:"none",fontSize:13,
              fontWeight:view===tab.key?700:400,color:view===tab.key?"#a07850":"#888",
              borderBottom:view===tab.key?"2px solid #a07850":"2px solid transparent",cursor:"pointer",whiteSpace:"nowrap"}}>
            {tab.label}
          </button>
        ))}
      </div>

      {loading&&<div style={{textAlign:"center",padding:20,color:"#a07850",fontSize:13}}>読み込み中...</div>}

      <div style={{padding:"16px",maxWidth:480,margin:"0 auto"}}>

        {view==="input"&&(
          <div>
            {missingCloseDates.length>0&&(
              <div style={{background:"#fff7ed",border:"1px solid #fbbf24",borderRadius:12,padding:"12px 14px",marginBottom:14,fontSize:12,color:"#92400e"}}>
                <div style={{fontWeight:700,marginBottom:4}}>⚠️ レジ締めが未完了の日があります</div>
                <div>{missingCloseDates.join("、")}</div>
              </div>
            )}
            <div style={{background:"white",borderRadius:16,padding:20,boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>
              <div style={{fontSize:15,fontWeight:700,marginBottom:16,color:"#a07850"}}>新規登録</div>
              <FR label="日付">
                <div style={{border:"1px solid #e8ddd0",borderRadius:10,background:"#fdf8f4",overflow:"hidden",display:"flex",alignItems:"center"}}>
                  <input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}
                    style={{flex:1,padding:"10px 12px",border:"none",background:"transparent",fontSize:14,outline:"none",minWidth:0}}/>
                </div>
              </FR>

              {form.date>=OPERATION_START&&(
                <div style={{marginBottom:16}}>
                  {selectedCustomer?(
                    <div style={{background:"linear-gradient(135deg,#c8a882,#a07850)",borderRadius:14,padding:16,color:"#fff"}}>
                      <div style={{fontSize:11,opacity:0.85,marginBottom:4}}>選択中のお客様</div>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <div>
                          <div style={{fontSize:16,fontWeight:800}}>{selectedCustomer.name} 様</div>
                          <div style={{fontSize:12,marginTop:4,background:"rgba(255,255,255,0.2)",display:"inline-block",padding:"2px 10px",borderRadius:20}}>{getVisitLabel(selectedCustomer.id)}</div>
                        </div>
                        <button onClick={()=>{setSelectedCustomer(null);setCustomerSearch("");}}
                          style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",fontSize:11,padding:"4px 10px",borderRadius:8,cursor:"pointer"}}>変更</button>
                      </div>
                    </div>
                  ):(
                    <div style={{background:"#fff",borderRadius:14,padding:16,boxShadow:"0 1px 6px rgba(0,0,0,0.05)"}}>
                      <div style={{fontSize:13,fontWeight:700,color:"#a07850",marginBottom:10}}>👤 お客様を選択</div>
                      {!showNewCustomerForm?(
                        <div>
                          <input placeholder="氏名 または 電話番号下4桁で検索" value={customerSearch}
                            onChange={e=>setCustomerSearch(e.target.value)} style={iS}/>
                          {searchedCustomers.length>0&&(
                            <div style={{marginTop:8}}>
                              {searchedCustomers.map(c=>(
                                <div key={c.id} onClick={()=>{setSelectedCustomer(c);setCustomerSearch("");}}
                                  style={{padding:"10px 12px",background:"#fdf8f4",borderRadius:10,marginBottom:6,cursor:"pointer"}}>
                                  <div style={{fontSize:14,fontWeight:700,color:"#3B332C"}}>{c.name}</div>
                                  <div style={{fontSize:11,color:"#999"}}>{c.phone}</div>
                                </div>
                              ))}
                            </div>
                          )}
                          <button onClick={()=>setShowNewCustomerForm(true)}
                            style={{width:"100%",marginTop:10,padding:"10px",borderRadius:10,border:"2px dashed #d9c3a8",background:"#fff",color:"#a07850",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                            ＋ 新しいお客様として登録
                          </button>
                        </div>
                      ):(
                        <div>
                          <input placeholder="お名前（フルネーム）" value={newCustomerName} onChange={e=>setNewCustomerName(e.target.value)} style={{...iS,marginBottom:8}}/>
                          <input placeholder="電話番号" value={newCustomerPhone} onChange={e=>setNewCustomerPhone(e.target.value)} style={{...iS,marginBottom:8}}/>
                          <div style={{display:"flex",gap:8}}>
                            <button onClick={()=>setShowNewCustomerForm(false)}
                              style={{flex:1,padding:"10px",borderRadius:10,border:"1.5px solid #e5e7eb",background:"#fff",color:"#6b7280",fontSize:13,fontWeight:600,cursor:"pointer"}}>キャンセル</button>
                            <button onClick={registerNewCustomerAndSelect}
                              style={{flex:2,padding:"10px",borderRadius:10,border:"none",background:"linear-gradient(135deg,#c8a882,#a07850)",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>登録して選択する</button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}
              {isOwner?(
                <FR label="担当スタッフ">
                  <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                    {STAFF_NAMES.map(s=>(
                      <button key={s} onClick={()=>setForm({...form,staff:s})}
                        style={{...cS,background:form.staff===s?"#a07850":"#f0e8de",color:form.staff===s?"white":"#a07850"}}>{s}</button>
                    ))}
                  </div>
                </FR>
              ):(
                <div style={{background:"#f0e8de",borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:14,fontWeight:600,color:"#a07850"}}>
                  担当：{currentUser.name}
                </div>
              )}
              <div style={{background:"#fdf0e8",borderRadius:12,padding:14,marginBottom:16}}>
                <div style={{fontSize:13,fontWeight:700,color:"#a07850",marginBottom:12}}>💅 施術</div>
                <FR label="メニュー（複数選択OK）">
                  <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                    {NAIL_MENUS.map(m=>{
                      const selected=(form.nailMenus||[]).includes(m);
                      return(
                        <button key={m} onClick={()=>toggleMenu(m)}
                          style={{...cS,background:selected?"#a07850":"#f0e8de",color:selected?"white":"#a07850",
                            border:selected?"2px solid #a07850":"2px solid transparent",position:"relative"}}>
                          {m}
                          {selected&&<span style={{position:"absolute",top:-4,right:-4,background:"white",color:"#a07850",borderRadius:"50%",width:14,height:14,fontSize:9,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,border:"1px solid #a07850"}}>✓</span>}
                        </button>
                      );
                    })}
                  </div>
                  {(form.nailMenus||[]).length>1&&(
                    <div style={{marginTop:6,fontSize:11,color:"#a07850",fontWeight:600}}>
                      選択中：{(form.nailMenus||[]).join(" ＋ ")}
                    </div>
                  )}
                </FR>
                <FR label="施術金額（円）">
                  <input type="number" placeholder="例：8000" value={form.nailPrice} onChange={e=>setForm({...form,nailPrice:e.target.value})} style={iS}/>
                </FR>
                {form.date>=OPERATION_START?(

                      <div style={{background:"#fdf8f4",borderRadius:10,padding:"12px 14px",marginBottom:8}}>
                        <div style={{fontSize:12,fontWeight:700,color:"#888",marginBottom:8}}>💅 メニュー別</div>
                        {NAIL_MENUS.map(m=>{const cnt=d.menuCounts[m]||0;const pct=d.count>0?Math.round((cnt/d.count)*100):0;return(<div key={m} style={{marginBottom:8}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12}}><span style={{color:"#888"}}>{m}</span><span style={{fontWeight:700,color:"#c87840"}}>{pct}%（{cnt}件）</span></div><Bar pct={pct} color="#c87840"/></div>);})}
                      </div>
                      <div style={{background:"#fdf8f4",borderRadius:10,padding:"12px 14px",marginBottom:8}}>
                        <div style={{fontSize:12,fontWeight:700,color:"#888",marginBottom:8}}>店販内訳</div>
                        {HANPAI_MENUS.map(m=>(<div key={m} style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"#888",marginBottom:6}}><span>{m}</span><span style={{fontWeight:600,color:"#c87840"}}>¥{(d.hanpai[m]||0).toLocaleString()}</span></div>))}
                      </div>
                      <div style={{background:"#fdf8f4",borderRadius:10,padding:"12px 14px"}}>
                        <div style={{fontSize:12,fontWeight:700,color:"#888",marginBottom:8}}>💳 決済比率</div>
                        {PAYMENTS.map(p=>{const cnt=d.payment[p]||0;const pct=d.count>0?Math.round((cnt/d.count)*100):0;return(<div key={p} style={{marginBottom:8}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12}}><span style={{color:"#888"}}>{p}</span><span style={{fontWeight:700,color:"#4a7a6a"}}>{pct}%（{cnt}件）</span></div><Bar pct={pct} color="#4a7a6a"/></div>);})}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {/* レジ締め */}
        {view==="register"&&(()=>{
          const system=computeSystemTotals(registerDate);
          const totalSystem=system.cash+system.credit+system.qr+system.smart;
          const totalActual=REGISTER_METHODS.reduce((s,m)=>s+(Number(registerActual[m.key])||0),0);
          const totalDiff=totalActual-totalSystem;
          if(registerExistingId&&!isOwner){
            return(
              <div>
                <div style={{border:"1px solid #e8ddd0",borderRadius:10,background:"#fdf8f4",overflow:"hidden",display:"flex",alignItems:"center",marginBottom:16}}>
                  <input type="date" value={registerDate} onChange={e=>setRegisterDate(e.target.value)}
                    style={{flex:1,padding:"10px 12px",border:"none",background:"transparent",fontSize:14,outline:"none",minWidth:0}}/>
                </div>
                <div style={{background:"#fef9f0",border:"1px solid #f5e3c0",borderRadius:14,padding:20,textAlign:"center"}}>
                  <div style={{fontSize:28,marginBottom:10}}>🔒</div>
                  <div style={{fontSize:14,fontWeight:700,color:"#8a6d3b",marginBottom:6}}>この日はすでに締め済みです</div>
                  <div style={{fontSize:12,color:"#a8916a"}}>修正が必要な場合はオーナーにご連絡ください</div>
                </div>
                <div style={{marginTop:16}}>
                  {REGISTER_METHODS.map(m=>{
                    const sys=system[m.key];
                    const actual=Number(registerActual[m.key])||0;
                    const diff=actual-sys;
                    return(
                      <div key={m.key} style={{background:diff!==0?"#fef5f4":"white",borderRadius:14,padding:16,marginBottom:10,boxShadow:"0 1px 6px rgba(0,0,0,0.05)"}}>
                        <div style={{fontSize:13,fontWeight:700,color:"#a07850",marginBottom:8}}>{m.emoji} {m.label}</div>
                        <div style={{fontSize:12,color:"#999"}}>システム売上 ¥{sys.toLocaleString()} ／ 実際 ¥{actual.toLocaleString()}</div>
                        <div style={{fontSize:13,fontWeight:800,color:diff===0?"#16a34a":"#ef4444",marginTop:4}}>差額：{diff===0?"¥0":(diff>0?"+":"−")+"¥"+Math.abs(diff).toLocaleString()}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          }
          if(registerSaved){
            return(
              <div style={{textAlign:"center",padding:"60px 20px"}}>
                <div style={{fontSize:48,marginBottom:16}}>✅</div>
                <div style={{fontSize:18,fontWeight:800,color:"#3B332C",marginBottom:8}}>レジ締めを保存しました</div>
                <div style={{fontSize:13,color:"#9B8E80",marginBottom:24}}>{registerDate}分の記録を保存しました</div>
                <button onClick={()=>setRegisterSaved(false)} style={{padding:"12px 28px",borderRadius:10,border:"1px solid #E5DCD0",background:"#fff",fontSize:14,color:"#6B6056",cursor:"pointer"}}>この日をもう一度見る</button>
              </div>
            );
          }
          return(
            <div>
              {missingCloseDates.length>0&&(
                <div style={{background:"#fff7ed",border:"1px solid #fbbf24",borderRadius:12,padding:"12px 14px",marginBottom:14,fontSize:12,color:"#92400e"}}>
                  <div style={{fontWeight:700,marginBottom:4}}>⚠️ レジ締めが未完了の日があります</div>
                  <div>{missingCloseDates.join("、")}</div>
                </div>
              )}
              <div style={{border:"1px solid #e8ddd0",borderRadius:10,background:"#fdf8f4",overflow:"hidden",display:"flex",alignItems:"center",marginBottom:16}}>
                <input type="date" value={registerDate} onChange={e=>setRegisterDate(e.target.value)}
                  style={{flex:1,padding:"10px 12px",border:"none",background:"transparent",fontSize:14,outline:"none",minWidth:0}}/>
              </div>
              {registerLoading?<div style={{textAlign:"center",color:"#a07850",fontSize:13,padding:20}}>読み込み中...</div>:(
              <>
              {REGISTER_METHODS.map(m=>{
                const actual=Number(registerActual[m.key])||0;
                const sys=system[m.key];
                const diff=actual-sys;
                const mismatch=String(registerActual[m.key])!==""&&diff!==0;
                return(
                  <div key={m.key} style={{background:mismatch?"#fef5f4":"white",border:mismatch?"2px solid #f3b8b0":"2px solid transparent",borderRadius:14,padding:16,marginBottom:10,boxShadow:"0 1px 6px rgba(0,0,0,0.05)"}}>
                    <div style={{fontSize:13,fontWeight:700,color:"#a07850",marginBottom:10}}>{m.emoji} {m.label}</div>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                      <div style={{fontSize:12,color:"#999",width:110}}>システム売上</div>
                      <div style={{fontSize:15,fontWeight:700,color:"#3B332C"}}>¥{sys.toLocaleString()}</div>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                      <div style={{fontSize:12,color:"#999",width:110}}>実際に数えた金額</div>
                      <input type="number" value={registerActual[m.key]} onChange={e=>setRegisterActual({...registerActual,[m.key]:e.target.value})}
                        style={{flex:1,padding:"8px 10px",border:"1px solid #e8ddd0",borderRadius:8,fontSize:14,background:"#fdf8f4",textAlign:"right"}}/>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:8,marginTop:8,borderTop:"1px dashed #eee"}}>
                      <div style={{fontSize:11,color:"#999"}}>差額</div>
                      <div style={{fontSize:mismatch?18:15,fontWeight:800,color:mismatch?"#ef4444":"#16a34a"}}>
                        {registerActual[m.key]===""?"−":(diff===0?"¥0":(diff>0?"+":"−")+"¥"+Math.abs(diff).toLocaleString())}
                      </div>
                    </div>
                    {mismatch&&(
                      <div style={{marginTop:12,paddingTop:12,borderTop:"1px dashed #f3b8b0"}}>
                        <div style={{fontSize:11,color:"#c97a6a",fontWeight:700,marginBottom:6}}>⚠️ 差額の理由</div>
                        <select value={(registerReasons[m.key]&&registerReasons[m.key].reason)||""}
                          onChange={e=>setRegisterReasons({...registerReasons,[m.key]:{...(registerReasons[m.key]||{}),reason:e.target.value}})}
                          style={{width:"100%",padding:"8px 10px",border:"1px solid #f3b8b0",borderRadius:8,fontSize:13,background:"#fff",marginBottom:8}}>
                          <option value="">選んでください</option>
                          {REASON_OPTIONS.map(r=><option key={r} value={r}>{r}</option>)}
                        </select>
                        <input type="text" placeholder="メモ（任意）" value={(registerReasons[m.key]&&registerReasons[m.key].memo)||""}
                          onChange={e=>setRegisterReasons({...registerReasons,[m.key]:{...(registerReasons[m.key]||{}),memo:e.target.value}})}
                          style={{width:"100%",padding:"8px 10px",border:"1px solid #f3b8b0",borderRadius:8,fontSize:13,background:"#fff"}}/>
                      </div>
                    )}
                  </div>
                );
              })}

              <div style={{background:totalDiff!==0?"linear-gradient(135deg,#d98a7a,#c05a48)":"linear-gradient(135deg,#c8a882,#a07850)",borderRadius:16,padding:20,color:"#fff",margin:"16px 0",textAlign:"center"}}>
                <div style={{fontSize:12,opacity:0.85,marginBottom:4}}>本日の差額</div>
                <div style={{fontSize:32,fontWeight:800,marginBottom:12}}>{totalDiff===0?"¥0":(totalDiff>0?"+":"−")+"¥"+Math.abs(totalDiff).toLocaleString()}</div>
                <div style={{display:"flex",justifyContent:"space-around",borderTop:"1px solid rgba(255,255,255,0.25)",paddingTop:12,marginTop:4}}>
                  <div style={{textAlign:"center"}}>
                    <div style={{fontSize:11,opacity:0.8,marginBottom:2}}>システム売上</div>
                    <div style={{fontSize:15,fontWeight:700}}>¥{totalSystem.toLocaleString()}</div>
                  </div>
                  <div style={{textAlign:"center"}}>
                    <div style={{fontSize:11,opacity:0.8,marginBottom:2}}>実際に数えた金額</div>
                    <div style={{fontSize:15,fontWeight:700}}>¥{totalActual.toLocaleString()}</div>
                  </div>
                </div>
              </div>

              <button onClick={saveRegisterClosing} disabled={registerSaving}
                style={{width:"100%",padding:15,borderRadius:12,border:"none",background:"linear-gradient(135deg,#c8a882,#a07850)",color:"#fff",fontSize:15,fontWeight:800,cursor:registerSaving?"not-allowed":"pointer",opacity:registerSaving?0.6:1}}>
                {registerSaving?"保存しています…":"この内容でレジ締めを保存する"}
              </button>
              <div style={{textAlign:"center",fontSize:11,color:"#b0a89c",marginTop:12}}>{registerDate} 締め担当：{currentUser.name}</div>
              </>
              )}
            </div>
          );
        })()}

        {/* レジ締め履歴 */}
        {view==="register_history"&&isOwner&&(()=>{
          if(selectedClosing){
            const c=selectedClosing;
            const diffTotal=(c.actual_cash+c.actual_credit+c.actual_qr+c.actual_smart)-(c.system_cash+c.system_credit+c.system_qr+c.system_smart);
            return(
              <div>
                <button onClick={()=>setSelectedClosing(null)} style={{fontSize:13,color:"#A89B8C",background:"none",border:"none",cursor:"pointer",padding:0,marginBottom:16}}>← 一覧へ戻る</button>
                <div style={{background:"#fff",borderRadius:20,padding:24,boxShadow:"0 4px 24px rgba(59,51,44,0.06)"}}>
                  <div style={{fontSize:18,fontWeight:800,color:"#3B332C"}}>{c.close_date}</div>
                  <div style={{fontSize:12,color:"#9B8E80",marginBottom:20}}>締め担当：{c.staff}</div>
                  <div style={{background:diffTotal!==0?"#fef2f2":"#f0fdf4",borderRadius:14,padding:16,marginBottom:20,textAlign:"center"}}>
                    <div style={{fontSize:12,color:"#888",marginBottom:4}}>この日の差額</div>
                    <div style={{fontSize:26,fontWeight:800,color:diffTotal!==0?"#ef4444":"#16a34a"}}>{diffTotal===0?"¥0":(diffTotal>0?"+":"−")+"¥"+Math.abs(diffTotal).toLocaleString()}</div>
                  </div>
                  {REGISTER_METHODS.map(m=>{
                    const sys=c["system_"+m.key]||0, act=c["actual_"+m.key]||0, diff=act-sys;
                    const note=(c.diff_notes||{})[m.key];
                    return(
                      <div key={m.key} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"10px 0",borderBottom:"1px solid #f5f0eb"}}>
                        <div>
                          <div style={{fontSize:13,fontWeight:700,color:"#3B332C"}}>{m.emoji} {m.label}</div>
                          <div style={{fontSize:11,color:"#999",marginTop:2}}>システム ¥{sys.toLocaleString()} → 実際 ¥{act.toLocaleString()}</div>
                          {note&&note.reason&&<div style={{display:"inline-block",background:"#fef2f2",color:"#ef4444",fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20,marginTop:6}}>{note.reason}</div>}
                          {note&&note.memo&&<div style={{fontSize:12,color:"#9B8E80",marginTop:4}}>{note.memo}</div>}
                        </div>
                        <div style={{fontSize:14,fontWeight:800,color:diff===0?"#16a34a":"#ef4444"}}>{diff===0?"¥0":(diff>0?"+":"−")+"¥"+Math.abs(diff).toLocaleString()}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          }

          const diffDays=closings.filter(c=>((c.actual_cash+c.actual_credit+c.actual_qr+c.actual_smart)-(c.system_cash+c.system_credit+c.system_qr+c.system_smart))!==0);
          const totalDiffSum=closings.reduce((s,c)=>s+((c.actual_cash+c.actual_credit+c.actual_qr+c.actual_smart)-(c.system_cash+c.system_credit+c.system_qr+c.system_smart)),0);
          return(
            <div>
              <div style={{border:"1px solid #e8ddd0",borderRadius:10,background:"#fdf8f4",overflow:"hidden",display:"flex",alignItems:"center",marginBottom:16}}>
                <input type="month" value={closingsMonth} onChange={e=>setClosingsMonth(e.target.value)}
                  style={{flex:1,padding:"10px 12px",border:"none",background:"transparent",fontSize:14,outline:"none",minWidth:0}}/>
              </div>
              <div style={{display:"flex",gap:8,marginBottom:16}}>
                <div style={{flex:1,background:"#fff",borderRadius:12,padding:12,textAlign:"center",boxShadow:"0 1px 6px rgba(0,0,0,0.05)"}}>
                  <div style={{fontSize:18,fontWeight:800,color:diffDays.length>0?"#ef4444":"#a07850"}}>{diffDays.length}</div>
                  <div style={{fontSize:10,color:"#999",marginTop:2}}>差額あり</div>
                </div>
                <div style={{flex:1,background:"#fff",borderRadius:12,padding:12,textAlign:"center",boxShadow:"0 1px 6px rgba(0,0,0,0.05)"}}>
                  <div style={{fontSize:18,fontWeight:800,color:totalDiffSum!==0?"#ef4444":"#a07850"}}>{totalDiffSum===0?"¥0":(totalDiffSum>0?"+":"−")+"¥"+Math.abs(totalDiffSum).toLocaleString()}</div>
                  <div style={{fontSize:10,color:"#999",marginTop:2}}>合計差額</div>
                </div>
                <div style={{flex:1,background:"#fff",borderRadius:12,padding:12,textAlign:"center",boxShadow:"0 1px 6px rgba(0,0,0,0.05)"}}>
                  <div style={{fontSize:18,fontWeight:800,color:"#a07850"}}>{closings.length}</div>
                  <div style={{fontSize:10,color:"#999",marginTop:2}}>締め回数</div>
                </div>
              </div>
              {closings.map(c=>{
                const diff=(c.actual_cash+c.actual_credit+c.actual_qr+c.actual_smart)-(c.system_cash+c.system_credit+c.system_qr+c.system_smart);
                return(
                  <div key={c.id} onClick={()=>setSelectedClosing(c)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"#fff",borderRadius:14,padding:"14px 16px",marginBottom:8,cursor:"pointer",boxShadow:"0 1px 6px rgba(0,0,0,0.05)"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <div style={{fontSize:18}}>{diff===0?"🟢":"🔴"}</div>
                      <div>
                        <div style={{fontSize:14,fontWeight:700,color:"#3B332C"}}>{c.close_date}</div>
                        <div style={{fontSize:11,color:"#999",marginTop:2}}>担当：{c.staff}</div>
                      </div>
                    </div>
                    <div style={{fontSize:14,fontWeight:800,color:diff===0?"#16a34a":"#ef4444"}}>{diff===0?"¥0":(diff>0?"+":"−")+"¥"+Math.abs(diff).toLocaleString()}</div>
                  </div>
                );
              })}
              {closings.length===0&&<EmptyState/>}
            </div>
          );
        })()}
      </div>

      {deleteTarget&&(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.5)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
          <div style={{background:"white",borderRadius:16,padding:24,width:"100%",maxWidth:320,textAlign:"center"}}>
            <div style={{fontSize:32,marginBottom:12}}>🗑️</div>
            <div style={{fontSize:16,fontWeight:700,marginBottom:8}}>この記録を削除しますか？</div>
            <div style={{fontSize:13,color:"#999",marginBottom:24}}>削除すると元に戻せません</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setDeleteTarget(null)}
                style={{flex:1,padding:12,background:"#f0e8de",border:"none",borderRadius:12,fontSize:14,fontWeight:700,color:"#a07850",cursor:"pointer"}}>
                キャンセル
              </button>
              <button onClick={confirmDelete}
                style={{flex:1,padding:12,background:"#e05050",border:"none",borderRadius:12,fontSize:14,fontWeight:700,color:"white",cursor:"pointer"}}>
                削除する
              </button>
            </div>
          </div>
        </div>
      )}

      {toast&&(
        <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#2d2016",color:"white",padding:"10px 24px",borderRadius:24,fontSize:13,fontWeight:600,boxShadow:"0 4px 16px rgba(0,0,0,0.2)",zIndex:100}}>
          {toast}
        </div>
      )}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(SalonApp));
</script>
</body>
</html>
